name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      # No Forge plugin, game libraries, assets, or game startup in this job.
      - run: .\gradlew.bat :core:check --console=plain
      - run: .\scripts\verify-core-boundary.ps1
  mod:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - shell: pwsh
        run: '"MIRA_JAVA17_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8.0.504+1'
      - shell: pwsh
        run: '"MIRA_JAVA8_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - run: .\gradlew.bat check build --console=plain
