name: Build
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core isolation
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify independent core and negative boundary controls
        shell: pwsh
        run: |
          .\gradlew.bat :core:check --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\verify-core-boundary.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: core-reports
          path: |
            core/build/reports/
            .work/boundary-controls/*.log
          retention-days: 14
  mod:
    name: Mods and integrations
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/java
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build standalone Mira
        shell: pwsh
        run: .\gradlew.bat check build --no-daemon --console=plain
      - name: Fetch checksummed integration APIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch-integration-apis.py
      - name: Verify every optional integration and package assets
        shell: pwsh
        run: |
          $integrationArgs = Get-Content .work/integration-apis/gradle-args.txt
          .\gradlew.bat @integrationArgs check checkIntegrations assembleIntegrations --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mod-reports
          path: '**/build/reports/'
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mira-distribution
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
