name: Bug report
description: Report a reproducible problem with Mira.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Mira version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Minecraft, Forge, Java, modpack version, and installed integrations.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, private task text, account details, and local paths.
      render: text
