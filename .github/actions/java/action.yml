name: Mira Java toolchains
description: Install pinned Java 8 (Forge), 17 (decompiler), and 25 (Gradle and core).
runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: '17.0.17+10'
    - shell: pwsh
      run: '"MIRA_JAVA17_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV'
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: '8.0.504+1'
    - shell: pwsh
      run: '"MIRA_JAVA8_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV'
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: '25.0.4.1+1'
